<!doctype html>
<!-- Development aid: draws every base pose and every move's wind-up, strike and recovery for one fighter. Open with ?c=cinder -->
<html><head><meta charset="utf-8"><title>BLOOD OATH pose sheet</title><style>body{margin:0;background:#1b1a22;color:#ddd;font:12px system-ui}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { solve, over } from '../render/rig.js';
import { drawFighter } from '../render/skins.js';
import { attackPose } from '../render/anim.js';
const id = new URLSearchParams(location.search).get('c') || 'cinder', only = new URLSearchParams(location.search).get('only');
const def = (await import(`../data/${id}.js`)).default, P = def.poses, cells = [];
if (only !== 'moves') for (const name of Object.keys(P)) cells.push([name, over(P.stance, P[name]), null]);
if (only !== 'base') for (const [mid, m] of Object.entries(def.moves)) { const total = m.startup + m.active + m.recovery; for (const [tag, mf] of [['wind', Math.round(m.startup * 0.62)], ['hit', m.startup], ['rec', m.startup + m.active + Math.round(m.recovery * 0.4)]]) cells.push([`${mid} ${tag} f${mf}`, attackPose(P, m, mf), m, mf]); }
const W = 300, H = 330, cols = 6, rows = Math.ceil(cells.length / cols), c = document.getElementById('c'), ctx = c.getContext('2d'); c.width = cols * W; c.height = rows * H;
cells.forEach(([label, pose, m, mf], i) => {
  const ox = (i % cols) * W + 110, oy = Math.floor(i / cols) * H + 265, air = m && m.air ? 50 : 0;
  ctx.fillStyle = i % 2 ? '#24232d' : '#201f28'; ctx.fillRect((i % cols) * W, Math.floor(i / cols) * H, W, H);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo((i % cols) * W, oy + .5); ctx.lineTo((i % cols) * W + W, oy + .5); ctx.stroke();
  ctx.save(); ctx.translate(ox, oy); ctx.scale(1, -1);
  const J = solve(def.rig, pose, 0, air, 1), view = {}, scratch = document.createElement('canvas').getContext('2d'); for (let k = 0; k < 40; k++) drawFighter(scratch, id, J, def.rig, view, 1.3 + k / 60, null); // let cloth settle
  drawFighter(ctx, id, J, def.rig, view, 2, null);
  if (m && m.box && label.includes('hit')) { ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2; ctx.strokeRect(m.box[0], air + m.box[1], m.box[2], m.box[3]); }
  ctx.strokeStyle = '#3bd16f'; ctx.lineWidth = 1; const b = def.box; ctx.strokeRect(-b.w / 2, air, b.w, m && m.crouch ? b.crouch : b.h);
  ctx.restore(); ctx.fillStyle = '#eee'; ctx.fillText(label, (i % cols) * W + 8, Math.floor(i / cols) * H + 16);
});
document.title = 'ready';
</script></body></html>
